tage through precision engineering and enduring craftsmanship that transcends generations.`,body:[`Trends arrive loudly and leave quietly. What remains — on the wrist, in the archive, and in the culture of watchmaking — is proportion, material honesty, and the patience to finish a bridge by hand.`,`At Chronos, heritage is not a mood board. It is a working method: calibers designed to be serviced for decades, cases shaped for balance rather than novelty, and dials that still read clearly under changing light.`,`The Return of Timeless Design is our invitation to look past the season. When a watch is built to outlast its owner’s first decade of wear, “classic” stops being nostalgia and becomes engineering.`,`This is the Chronos promise — precision that feels inevitable, and beauty that does not need to shout.`],image:`./assets/images/journal/journal-featured.webp`,category:`Heritage`,readMinutes:8,date:`2024-05-24`,featured:!0},yl=[{id:`a1`,slug:`the-art-of-mechanical-precision`,title:`The Art of Mechanical Precision`,excerpt:`Inside the atelier where every gear, jewel and bevel is finished to tolerances measured in microns.`,body:[`Mechanical precision is not a slogan on a hangtag. It is the daily discipline of machining, adjusting and listening to a caliber until its beat is even under the loupe.`,`Our watchmakers spend years learning to feel resistance in a train wheel, to read the grain of a bevel, and to know when a jewel is seated correctly by sound as much as sight.`,`The Art of Mechanical Precision documents that quiet craft — the hours no client sees, and the standards we refuse to automate away.`],image:`./assets/images/journal/journal-mechanics.webp`,category:`Craftsmanship`,readMinutes:6,date:`2024-05-18`},{id:`a2`,slug:`time-nature-perfection`,title:`Time, Nature, Perfection`,excerpt:`How alpine light, stone and silence shape the way we test — and design — a Chronos case.`,body:[`Nature keeps better time than any marketing calendar. Temperature swings, altitude and dust reveal weaknesses in a seal long before a showroom ever would.`,`We take prototypes into the mountains for a reason: if a case can hold its integrity where the air thins and the rock is cold, it will hold on a city street.`,`Time, Nature, Perfection is a meditation on why outdoor testing still belongs in a Swiss manufacture that otherwise lives by the loupe.`],image:`./assets/images/journal/journal-mountains-watch.webp`,category:`Inspiration`,readMinutes:5,date:`2024-05-12`},{id:`a3`,slug:`designing-for-generations`,title:`Designing for Generations`,excerpt:`From first graphite sketch to sapphire crystal — building watches meant to be worn by more than one lifetime.`,body:[`Every Chronos reference begins as a sketch that must survive argument. If a line cannot justify itself under scrutiny, it does not leave the page.`,`Designing for generations means choosing dials that age with dignity, bracelets that can be resized without drama, and movements that a future watchmaker can still service.`,`We keep the discarded sketches. They are a reminder that restraint is a design decision — and often the hardest one.`],image:`./assets/images/journal/journal-sketch.webp`,category:`Design`,readMinutes:7,date:`2024-05-05`},{id:`a4`,slug:`innovation-behind-tradition`,title:`Innovation Behind Tradition`,excerpt:`New alloys, smarter regulation, familiar silhouettes — how Chronos advances without abandoning its DNA.`,body:[`Tradition without progress becomes costume. Progress without tradition becomes fashion. Chronos lives in the tension between the two.`,`Behind every familiar case profile sits metallurgy research, accelerated wear testing and regulation protocols that did not exist when our first atelier opened.`,`Innovation Behind Tradition is the story of those invisible upgrades — the ones a wearer feels as reliability, not as a press release.`],image:`./assets/images/journal/journal-movement.webp`,category:`Technology`,readMinutes:6,date:`2024-04-28`},{id:`a5`,slug:`the-jewels-that-carry-time`,title:`The Jewels That Carry Time`,excerpt:`Synthetic rubies, friction and the quiet engineering that keeps a caliber running for decades.`,body:[`Jewels are not decoration. They are bearing surfaces harder than the steel they support, chosen to reduce wear at the points that move most often.`,`Understanding where jewels sit — and why — is one of the fastest ways to read a movement like a watchmaker.`,`We walk through the role of each stone in our flagship caliber, and why we still insist on finishing the seats by hand.`],image:`./assets/images/journal/journal-mechanics.webp`,category:`Craftsmanship`,readMinutes:5,date:`2024-04-20`},{id:`a6`,slug:`light-on-the-dial`,title:`Light on the Dial`,excerpt:`Why dial finishing, lume and contrast matter more than any complication on the brochure.`,body:[`A watch is read in motion — under office fluorescents, evening candlelight, and the harsh noon of travel. Dial design must survive all three.`,`We discuss lume placement, hand lengths and the quiet hierarchy of indices that make a Chronos dial legible without shouting.`,`Light on the Dial is a short masterclass in the graphic decisions owners notice every day without naming them.`],image:`./assets/images/journal/journal-sketch.webp`,category:`Design`,readMinutes:4,date:`2024-04-12`},{id:`a7`,slug:`altitude-and-the-seal`,title:`Altitude and the Seal`,excerpt:`What mountain testing taught us about gaskets, crowns and long-term water resistance.`,body:[`Water resistance ratings are promises. Altitude testing is evidence. The pressure and temperature swing of a single alpine day can expose a weak gasket faster than months of desk wear.`,`Our case team logs every prototype that fails — and every one that does not — so geometry improves with data, not folklore.`,`Altitude and the Seal shares the discipline behind the numbers printed on our casebacks.`],image:`./assets/images/journal/journal-mountains-watch.webp`,category:`Technology`,readMinutes:5,date:`2024-04-04`},{id:`a8`,slug:`archives-of-a-manufacture`,title:`Archives of a Manufacture`,excerpt:`Notebooks, rejected bridges and the heritage stories that still shape new references.`,body:[`Our archive is not a museum display. It is a working library of failures, breakthroughs and unfinished ideas.`,`When a new Legacy bridge needed a forgotten geometry, the answer was waiting in water-stained notebooks from the early atelier years.`,`Archives of a Manufacture is an invitation into that room — and into why remembering is a form of innovation.`],image:`./assets/images/journal/journal-movement.webp`,category:`Heritage`,readMinutes:7,date:`2024-03-22`}],bl=[vl,...yl],xl=e=>bl.find(t=>t.slug===e),Sl=e=>new Date(e).toLocaleDateString(`en-US`,{month:`long`,day:`numeric`,year:`numeric`}),Cl=()=>{let e=P(e=>e.overlays.article),t=P(e=>e.closeOverlay),n=P(e=>e.activeArticleSlug),r=P(e=>e.setActiveArticleSlug),[i,a]=(0,_.useState)(0),o=(0,_.useRef)(null),s=n?xl(n):void 0;(0,_.useEffect)(()=>{o.current&&(o.current.scrollTop=0),a(0)},[n]);let c=()=>{let e=o.current;if(!e)return;let t=e.scrollHeight-e.clientHeight;a(t>0?Math.min(1,e.scrollTop/t):0)},l=s?bl.filter(e=>e.id!==s.id&&e.category===s.category).slice(0,3):[],u=s&&l.length<3?bl.filter(e=>e.id!==s.id&&!l.includes(e)).slice(0,3-l.length):[],d=[...l,...u];return s?(0,Z.jsx)(cl,{isOpen:e,onClose:()=>t(`article`),labelledBy:`article-title`,variant:`full`,children:(0,Z.jsxs)(`div`,{className:`article-modal`,children:[(0,Z.jsx)(`div`,{className:`article-modal__progress`,children:(0,Z.jsx)(`div`,{className:`article-modal__progress-fill`,style:{transform:`scaleX(${i})`}})}),(0,Z.jsxs)(`div`,{className:`article-modal__topbar container`,children:[(0,Z.jsx)(`span`,{className:`eyebrow`,children:s.category}),(0,Z.jsx)(`button`,{type:`button`,className:`icon-btn`,"aria-label":`Close article`,onClick:()=>t(`article`),children:(0,Z.jsx)(Q,{name:`close`,size:18})})]}),(0,Z.jsxs)(`div`,{className:`article-modal__body`,ref:o,onScroll: ry timepiece is hand-delivered or shipped fully insured via appointment, in coordination with your concierge.`,`Bespoke and limited-edition pieces are final sale once production has begun. In-stock references may be returned within 14 days in unworn condition.`,`Worldwide shipping is complimentary on all confirmed orders.`]},warranty:{title:`Warranty`,paragraphs:[`Every CHRONOS movement carries a five-year international warranty covering manufacturing defects in materials and workmanship.`,`Warranty does not cover water damage from unauthorized case openings or accidental impact. Register your timepiece within 30 days of delivery to activate full coverage.`]},careers:{title:`Careers`,paragraphs:[`We hire watchmakers, case finishers and client relations specialists directly into our Zurich and Geneva ateliers — typically through referral and an eighteen-month apprenticeship track.`,`Open roles are listed with our federation partners. Reach out to careers@chronoswatches.com with a portfolio or CV.`]},press:{title:`Press & Media`,paragraphs:[`For imagery, interview requests or embargoed announcements, contact our press office at press@chronoswatches.com.`,`A curated press kit including product photography and brand history is available on request.`]},heritage:{title:`Heritage`,paragraphs:[`CHRONOS was founded on a simple conviction: timepieces should outlast trends. Our archive of sketches, calibers and case geometries still informs every new reference.`,`Heritage for us is a working method — finishing standards, material honesty and the patience to build watches meant for more than one generation.`]},sustainability:{title:`Sustainability`,paragraphs:[`We source responsibly, design for repairability and keep movements serviceable for decades — the most durable form of luxury.`,`Packaging is recyclable, and our Zurich atelier runs on renewable energy where municipal supply allows.`]},partnerships:{title:`Partnerships`,paragraphs:[`Select collaborations with galleries, private clubs and cultural institutions are considered by invitation.`,`For partnership enquiries, write to partnerships@chronoswatches.com with a brief and proposed timeline.`]},"limited-editions":{title:`Limited Editions`,paragraphs:[`Limited editions are produced in tightly controlled series and allocated through our concierge team.`,`Availability is confirmed individually. Join the newsletter or book a visit to be considered for upcoming releases.`]},bespoke:{title:`Bespoke Creations`,paragraphs:[`Bespoke Chronos pieces begin with a private consultation covering dial, case metal, engraving and delivery timeline.`,`Production typically spans several months. Book a visit to begin the conversation with our atelier advisors.`]},materials:{title:`Materials & Innovation`,paragraphs:[`From proprietary alloys to sapphire crystals and hand-finished bridges, every material is chosen for longevity under wear.`,`Innovation at Chronos is quiet — upgrades you feel as reliability rather than novelty.`]},"swiss-made":{title:`Swiss Made`,paragraphs:[`Every Chronos timepiece meets Swiss Made criteria: design, assembly and final inspection are completed in Switzerland.`,`Our movements are regulated and tested in-house before leaving the atelier.`]},"quality-control":{title:`Quality Control`,paragraphs:[`Each finished watch passes timed rate tests, water-resistance checks and a multi-day wear trial by our regulation team.`,`Only pieces that meet our internal tolerances are released to clients.`]},events:{title:`Events`,paragraphs:[`Private viewings, atelier evenings and seasonal presentations are shared first with newsletter subscribers.`,`Follow Chronos on social channels or subscribe below for invitations.`]},interviews:{title:`Interviews`,paragraphs:[`Conversations with our watchmakers, designers and long-standing clients appear regularly in The Journal.`,`Visit the Journal section for the latest interviews and atelier notes.`]},faq:{title:`FAQ`,paragraphs:[`Most questions about
